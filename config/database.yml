default: &default
  host: localhost
  adapter: sqlite3
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # Milisegundos que una conexión espera el lock de escritura antes de fallar.
  # (retries reintenta sin esperar en Rails 7.2 y se agota en ~0 ms)
  timeout: 5000
  pragmas:
    # level of database durability, 2 = "FULL" (sync on every write), other values include 1 = "NORMAL" (sync every 1000 written pages) and 0 = "NONE"
    # https://www.sqlite.org/pragma.html#pragma_synchronous
    synchronous: "NORMAL"
    # Journal mode WAL allows for greater concurrency (many readers + one writer)
    # https://www.sqlite.org/pragma.html#pragma_journal_mode
    journal_mode: "WAL"
    # impose a limit on the WAL file to prevent unlimited growth (with a negative impact on read performance as well)
    # https://www.sqlite.org/pragma.html#pragma_journal_size_limit
    journal_size_limit: <%= 64.megabytes %>
    # set the global memory map so all processes can share data
    # https://www.sqlite.org/pragma.html#pragma_mmap_size
    # https://www.sqlite.org/mmap.html
    mmap_size: <%= 128.megabytes %>
    # increase the local connection cache to 2000 pages
    # https://www.sqlite.org/pragma.html#pragma_cache_size
    cache_size: 2000

development:
  primary:
    <<: *default
    database: db/puntapie_development.sqlite3
  queue:
    <<: *default
    database: db/puntapie_development_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: db/puntapie_development_cable.sqlite3
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: db/puntapie_test.sqlite3

production:
  primary:
    <<: *default
    database: /home/ubuntu/puntapie/db/puntapie_production.sqlite
  cache:
    <<: *default
    database: /home/ubuntu/puntapie/db/puntapie_production_cache.sqlite
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: /home/ubuntu/puntapie/db/puntapie_production_queue.sqlite
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: /home/ubuntu/puntapie/db/puntapie_production_cable.sqlite
    migrations_paths: db/cable_migrate
