plugins:
  - rubocop-rails

inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.4
  Exclude:
    - "db/**/*"
    - "config/**/*"
    - "app/views/**/*"
    - "lib/tasks/*"
    - "spec/spec_helper.rb"
    - "spec/rails_helper.rb"
    - test_models.rb
    - "bin/*"
    - vendor/**/*
  NewCops: disable # see https://docs.rubocop.org/rubocop/versioning.html#pending-cops

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Style/SymbolArray:
  Exclude:
    - spec/factories/*

Style/AccessorGrouping:
  Enabled: false

Style/KeywordParametersOrder:
  Enabled: false

Style/NumericLiterals:
  Enabled: false

Style/HashSyntax:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 130

Metrics/AbcSize:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Naming/VariableNumber:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*_spec.rb"

# Este cop lee db/schema.rb, que todavía no existe cuando template.rb genera .rubocop_todo.yml, así que
# no queda en el todo. Agregar los índices únicos exige una migración aparte.
Rails/UniqueValidationWithoutIndex:
  Exclude:
    - app/models/invitation.rb
    - app/models/membership.rb
    - app/models/role.rb
